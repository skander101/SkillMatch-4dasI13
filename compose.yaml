name: skillmatch

services:
  rabbitmq:
    image: rabbitmq:4.4.1-management
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-skillmatch}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-skillmatch-local}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  rabbitmq_data:
