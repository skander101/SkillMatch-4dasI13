server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: profils-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:profils_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:false}
    fetch-registry: ${EUREKA_FETCH:false}

jwt:
  secret: ${JWT_SECRET:skillmatch-local-development-secret-key-change-me}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

commun-service:
  url: ${COMMUN_SERVICE_URL:${GATEWAY_URL:http://localhost:8088}}

profils:
  cv:
    max-size-bytes: ${CV_MAX_SIZE_BYTES:5242880}

messaging:
  enabled: ${MESSAGING_ENABLED:true}
  exchange: ${SKILLMATCH_EXCHANGE:skillmatch.events}
  queue: ${PROFILS_TEST_PASSED_QUEUE:profils.test-passed}
  routing-key: ${TEST_PASSED_ROUTING_KEY:test.passed}
  published-routing-key: ${PROFILE_UPDATED_ROUTING_KEY:profile.updated}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: ${MESSAGING_ENABLED:true}
