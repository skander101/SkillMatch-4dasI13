server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: commun-auth
          uri: ${COMMUN_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/skillmatch/auth/**
        - id: commun-utilisateurs
          uri: ${COMMUN_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/skillmatch/utilisateurs/**
        - id: offres
          uri: ${OFFRES_SERVICE_URL:lb://offres-service}
          predicates:
            - Path=/skillmatch/offres/**
        - id: candidatures
          uri: ${OFFRES_SERVICE_URL:lb://offres-service}
          predicates:
            - Path=/skillmatch/candidatures/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

info:
  app:
    name: ${spring.application.name}
    description: Supervision du microservice SkillMatch
