server:
  port: ${CONFIG_SERVER_PORT:8889}
  address: 127.0.0.1 # Serveur local de développement.

spring:
  application:
    name: config-service
  profiles:
    active: native # Lecture des YAML locaux, sans dépôt Git distant.
  cloud:
    config:
      server:
        accept-empty: false
        native:
          search-locations: ${CONFIG_REPO_LOCATION:classpath:/config-repo/}
          add-label-locations: false

management:
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics

info:
  app:
    name: ${spring.application.name}
    description: Supervision du microservice SkillMatch
