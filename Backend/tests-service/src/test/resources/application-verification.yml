spring:
  datasource:
    url: jdbc:h2:mem:tests_verification;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

eureka:
  client:
    enabled: false

management:
  health:
    rabbit:
      enabled: false

app:
  rabbitmq:
    publication-enabled: false
