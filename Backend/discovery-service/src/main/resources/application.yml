server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-service

eureka:
  instance:
    hostname: localhost
  client:
    # Un serveur local unique ne cherche pas d'autres serveurs Eureka.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:${server.port}/eureka/

management:
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics

info:
  app:
    name: ${spring.application.name}
    description: Supervision du microservice SkillMatch
