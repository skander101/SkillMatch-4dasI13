server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: entreprises-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:entreprises_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 500ms
        max-interval: 2s
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:false}
        default-requeue-rejected: false

commun-service:
  url: ${COMMUN_SERVICE_URL:http://localhost:8087}

skillmatch:
  events:
    exchange: ${RABBITMQ_EXCHANGE:skillmatch.events}
    queue-prefix: ${RABBITMQ_QUEUE_PREFIX:skillmatch.entreprises}
    listener-enabled: ${RABBITMQ_LISTENER_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:false}
    fetch-registry: ${EUREKA_FETCH:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  tags-sorter: alpha
  operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false
