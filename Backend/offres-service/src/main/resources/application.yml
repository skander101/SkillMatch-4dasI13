server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: offres-service
  jackson:
    deserialization:
      accept-float-as-int: false # Refuse CV, identifiants et notes décimaux au lieu de les tronquer.
  # Phase 1 : conserver les dependances du template sans activer RabbitMQ.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:offres_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
  instance:
    prefer-ip-address: true # Annonce une adresse IP utilisable par la Gateway.

# Clé locale obligatoire, identique à celle de commun-service ; aucun secret dans Git.
jwt:
  secret: ${JWT_SECRET}

# Adresse du service existant qui retourne l'utilisateur réel.
commun-service:
  url: ${COMMUN_SERVICE_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
